<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>MultiShop Hub · Live Inventory & Marketplace</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ========== GLOBAL RESET & VARIABLES ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green-dark: #0c2e22;
      --green-mid: #1a7a5c;
      --green-light: #b8e0cc;
      --green-soft: #e2f3e9;
      --white: #ffffff;
      --shadow-sm: 0 4px 12px rgba(0,40,20,0.04);
      --shadow-md: 0 10px 24px rgba(0,40,20,0.08);
      --shadow-lg: 0 20px 40px rgba(0,40,20,0.12);
      --border: #d0e6db;
      --danger: #c44536;
      --warn: #e9b741;
      --radius: 24px;
      --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #edf7f2, #d4ece0);
      color: #1a2e2a;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; right: -20%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(47,143,112,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%; left: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(47,143,112,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .app-shell { display: flex; min-height: 100vh; width: 100%; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0c2e22 0%, #0a271c 100%);
      color: white;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 100;
      box-shadow: 4px 0 24px rgba(0,30,15,0.15);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(184,224,204,0.3) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(184,224,204,0.3); border-radius: 10px; }

    .sidebar-brand {
      padding: 0 24px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(184,224,204,0.12);
      margin-bottom: 16px;
    }
    .sidebar-brand .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--green-mid), #2aa87a);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .sidebar-brand .brand-text {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .sidebar-brand .brand-text span { color: #5ed4a5; }

    .sidebar-user {
      padding: 0 20px 18px;
      margin: 0 12px 8px;
      border-bottom: 1px solid rgba(184,224,204,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-user .avatar {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(94,212,165,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .sidebar-user .user-info { flex: 1; min-width: 0; }
    .sidebar-user .user-info .name {
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-user .user-info .role {
      font-size: 0.72rem;
      color: #5ed4a5;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .sidebar-section { padding: 0 12px; margin-bottom: 6px; }
    .sidebar-section-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(184,224,204,0.5);
      padding: 12px 16px 8px;
      font-weight: 700;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 12px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      width: 100%;
      text-align: left;
      position: relative;
    }
    .sidebar-link .icon { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; opacity: 0.85; }
    .sidebar-link:hover { background: rgba(94,212,165,0.1); color: white; }
    .sidebar-link.active {
      background: linear-gradient(90deg, rgba(94,212,165,0.2), rgba(94,212,165,0.05));
      color: white;
      font-weight: 600;
    }
    .sidebar-link.active::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 3px;
      background: #5ed4a5;
      border-radius: 0 4px 4px 0;
    }
    .sidebar-link .cart-badge {
      margin-left: auto;
      background: #e9b741;
      color: #0c2e22;
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 0.7rem;
      font-weight: 800;
      min-width: 20px;
      text-align: center;
    }
    .sidebar-footer {
      margin-top: auto;
      padding: 16px 12px 8px;
      border-top: 1px solid rgba(184,224,204,0.1);
    }
    .sidebar-footer .logout-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 12px;
      color: #ff8a80;
      background: transparent;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all 0.15s ease;
    }
    .sidebar-footer .logout-btn:hover { background: rgba(255,138,128,0.12); }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 28px 36px 60px;
      min-height: 100vh;
      width: calc(100% - 280px);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .top-bar .page-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--green-dark);
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top-bar .page-title .page-icon { font-size: 1.6rem; }
    .top-bar .page-subtitle { font-size: 0.9rem; color: #5b7a6b; margin-top: 2px; }
    .top-bar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .sidebar-toggle {
      display: none;
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 200;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--green-mid);
      color: white;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(26,122,92,0.4);
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .sidebar-toggle:hover { background: var(--green-dark); transform: scale(1.05); }
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,20,10,0.5);
      z-index: 99;
      backdrop-filter: blur(3px);
    }
    .sidebar-overlay.show { display: block; }

    /* ========== COMMON UI ========== */
    h1, h2, h3, h4 { font-weight: 700; color: var(--green-dark); letter-spacing: -0.02em; }
    h2 { font-size: 1.5rem; margin-bottom: 4px; }
    h3 { font-size: 1.15rem; }

    button, .btn {
      background: var(--green-mid);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(26,122,92,0.25);
      letter-spacing: -0.01em;
    }
    button:hover, .btn:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(12,46,34,0.3);
    }
    button:active { transform: translateY(0); }
    button.secondary, .btn.secondary {
      background: white;
      color: var(--green-mid);
      border: 1.5px solid var(--border);
      box-shadow: none;
    }
    button.secondary:hover { background: var(--green-soft); border-color: var(--green-light); }
    button.danger { background: var(--danger); box-shadow: 0 4px 12px rgba(196,69,54,0.25); }
    button.danger:hover { background: #a13d3d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    input, select, textarea {
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 60px;
      font-size: 0.9rem;
      background: white;
      outline: none;
      transition: all var(--transition);
      width: 100%;
      color: var(--green-dark);
      font-weight: 500;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--green-mid);
      box-shadow: 0 0 0 4px rgba(26,122,92,0.12);
    }
    input::placeholder { color: #8ba89b; font-weight: 400; }

    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .card {
      background: white;
      border-radius: var(--radius);
      padding: 22px 26px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .card:hover { border-color: var(--green-light); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .grid-3, .grid-4 { display: grid; gap: 20px; }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

    .badge {
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 5px 14px;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
      letter-spacing: 0.02em;
    }
    .badge.open { background: #d0f0e0; color: #0a4a32; }
    .badge.closed { background: #f5e0de; color: #a13d3d; }
    .badge.pending { background: #fff2cc; color: #7a5c00; }
    .badge.accepted { background: #d0e6ff; color: #1a4b7a; }
    .badge.delivered { background: #d0f0e0; color: #0a4a32; }
    .badge.rejected { background: #f5e0de; color: #a13d3d; }
    .price { font-weight: 800; color: var(--green-dark); font-size: 1.1rem; letter-spacing: -0.02em; }
    .muted { color: #5b7a6b; font-size: 0.88rem; line-height: 1.5; }
    .separator { height: 1.5px; background: var(--border); margin: 18px 0; border-radius: 2px; }

    .shop-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all var(--transition);
      position: relative;
    }
    .shop-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--green-light); }
    .shop-logo {
      width: 58px; height: 58px;
      background: linear-gradient(135deg, var(--green-soft) 0%, #d4ece0 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.7rem;
      color: var(--green-dark);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .product-thumb {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--green-soft) 0%, #d4ece0 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--green-dark);
      flex-shrink: 0;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th {
      text-align: left; padding: 12px 8px;
      color: var(--green-dark); font-weight: 700;
      border-bottom: 2.5px solid var(--green-light);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--green-soft); }

    #toast {
      position: fixed; bottom: 32px; right: 32px;
      background: var(--green-dark); color: white;
      padding: 16px 28px; border-radius: 80px;
      box-shadow: 0 16px 40px rgba(0,30,15,0.4);
      z-index: 9999; display: none;
      font-weight: 600; font-size: 0.9rem;
      max-width: 400px; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .modal-bg {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,30,15,0.45); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: white; border-radius: 32px; padding: 32px;
      max-width: 520px; width:100%; max-height: 85vh; overflow: auto;
      box-shadow: 0 40px 80px rgba(0,30,10,0.25);
    }
    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 18px 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-value { font-size: 1.7rem; font-weight: 800; color: var(--green-dark); letter-spacing: -0.03em; }
    .stat-label { font-size: 0.75rem; color: #5b7a6b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .empty-state { text-align: center; padding: 48px 24px; color: #8ba89b; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
    .cart-badge-inline {
      background: var(--danger);
      color: white;
      border-radius: 60px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 4px;
      min-width: 20px;
      text-align: center;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== AUTH (COMPACT LOGIN & REGISTER) ========== */
    .auth-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 16px;
    }
    .auth-container {
      background: white;
      border-radius: 28px;
      padding: 32px 36px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 18px 48px rgba(0, 40, 30, 0.16);
      border: 1px solid rgba(176, 223, 204, 0.4);
      animation: slideUp 0.4s ease-out;
      position: relative;
      z-index: 1;
    }
    .auth-container.register { max-width: 480px; }

    .auth-logo-area { text-align: center; margin-bottom: 18px; }
    .auth-logo-icon {
      background: linear-gradient(145deg, #1d7359, #145c47);
      color: white;
      width: 52px; height: 52px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
      box-shadow: 0 8px 20px rgba(29, 115, 89, 0.3);
      transition: transform 0.3s ease;
    }
    .auth-logo-icon:hover { transform: scale(1.06) rotate(-4deg); }
    .auth-logo-text { font-size: 1.6rem; font-weight: 800; color: #0f4737; letter-spacing: -0.5px; }
    .auth-logo-text span { color: #2f8f70; }
    .auth-subtitle {
      font-size: 0.85rem;
      color: #145c47;
      margin-bottom: 18px;
      text-align: center;
      font-weight: 500;
      opacity: 0.85;
    }
    .auth-subtitle i { color: #2f8f70; margin-right: 6px; }

    .auth-group { margin-bottom: 12px; }
    .auth-group label {
      display: block;
      font-weight: 600;
      color: #145c47;
      margin-bottom: 4px;
      font-size: 0.78rem;
    }
    .auth-group label i { color: #2f8f70; margin-right: 6px; width: 16px; font-size: 0.8rem; }
    .auth-group input, .auth-group select, .auth-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d8efe3;
      border-radius: 12px;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      background: #f8fcf9;
      font-family: 'Inter', sans-serif;
      color: #1a2e28;
    }
    .auth-group input:focus, .auth-group select:focus, .auth-group textarea:focus {
      outline: none;
      border-color: #2f8f70;
      box-shadow: 0 0 0 3px rgba(47, 143, 112, 0.14);
      background: white;
    }
    .auth-group input.input-error { border-color: #b34040; background: #fff5f5; }
    .auth-group input.input-success { border-color: #2f8f70; background: #f8fcf9; }

    .auth-btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(145deg, #1d7359, #145c47);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(29, 115, 89, 0.25);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .auth-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(29, 115, 89, 0.35); }
    .auth-btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .auth-error-msg {
      background: #fde8e8;
      color: #b34040;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      border-left: 3px solid #b34040;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: shake 0.5s ease;
    }
    .auth-success-msg {
      background: #e8f5ed;
      color: #1d7359;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      border-left: 3px solid #1d7359;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-link {
      text-align: center;
      margin-top: 14px;
      color: #145c47;
      font-size: 0.8rem;
      padding-top: 12px;
      border-top: 1px solid #d8efe3;
    }
    .auth-link a { color: #1d7359; font-weight: 700; text-decoration: none; cursor: pointer; }
    .auth-link a:hover { color: #0f4737; text-decoration: underline; }

    .auth-security-badge {
      text-align: center;
      margin-top: 12px;
      font-size: 0.68rem;
      color: #7fc7ae;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .auth-security-badge span { display: flex; align-items: center; gap: 4px; }
    .auth-security-badge i { margin-right: 3px; }

    .password-toggle { position: relative; }
    .password-toggle .toggle-btn {
      position: absolute;
      right: 14px;
      top: 32px;
      background: none;
      border: none;
      color: #7fc7ae;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 3px;
      transition: color 0.2s;
      box-shadow: none;
      width: auto;
    }
    .password-toggle .toggle-btn:hover { color: #2f8f70; background: none; transform: none; }

    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: #d8efe3;
      margin-top: 6px;
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .strength-bar .fill { height: 100%; transition: width 0.3s ease; width: 0%; }
    .strength-label { font-size: 0.68rem; color: #7fc7ae; margin-top: 3px; text-align: right; }

    .password-requirements {
      font-size: 0.68rem;

    const inv = get(LS.INVENTORY, []);
    const idx = inv.findIndex(i => i.productId === productId);

  function checkPasswordStrength(password) {
    const hasLength = password.length >= 8;
    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasDigit = /[0-9]/.test(password);
    const hasSpecial = /[^A-Za-z0-9]/.test(password);
    let score = 0;
    if (hasLength) score += 20;
    if (hasUpper) score += 20;
    if (hasLower) score += 20;
    if (hasDigit) score += 20;
    if (hasSpecial) score += 20;
    return { hasLength, hasUpper, hasLower, hasDigit, hasSpecial, score };

  // ============================================================
  // ROUTER
  // ============================================================
  function renderView(view) {
    const user = currentUser();
    if (!user && view !== 'login' && view !== 'register') view = 'login';

    renderTopBar(view);
    renderSidebar();

    const $v = $('#appView').empty();
    switch (view) {
      case 'login': viewLogin(); break;
      case 'register': viewRegister(); break;
      case 'marketplace': viewMarketplace(); break;
      case 'cart': viewCart(); break;
      case 'orders': viewCustomerOrders(); break;
      case 'profile': viewProfile(); break;
      case 'dashboard': viewMainDashboard(); break;
      case 'myshops': viewMyShops(); break;
      case 'supplierMarket': viewSupplierMarket(); break;
      case 'products': viewProducts(); break;
      case 'inventory': viewInventory(); break;
      case 'sales': viewSalesHistory(); break;
      case 'purchaseorders': viewPurchaseOrders(); break;
      case 'customerOrders': viewShopkeeperCustomerOrders(); break;
      case 'mini': viewMiniShopkeepers(); break;
      case 'reports': viewReports(); break;
      case 'miniDashboard': viewMiniDashboard(); break;
      case 'miniSale': viewMiniSale(); break;
      case 'miniHistory': viewMiniSalesHistory(); break;
      case 'supplierDashboard': viewSupplierDashboard(); break;
      case 'supplierShops': viewSupplierShops(); break;
      case 'supplierProducts': viewSupplierProducts(); break;
      case 'supplierOrders': viewSupplierOrders(); break;
      default: viewMarketplace();
    }
    $v.addClass('fade-in');
    $('.sidebar-link').removeClass('active');
    $(`.sidebar-link[data-nav="${view}"]`).addClass('active');
    if ($(window).width() < 860) closeSidebar();
  }

  // ============================================================
  // CUSTOMER VIEWS
  // ============================================================
  let marketplaceFilter = { search: '', category: '' };

  function viewMarketplace() {
    const shops = get(LS.SHOPS, []).filter(s => s.type === 'retail' && s.active && s.approved);
    const categories = [...new Set(shops.map(s => s.category))];

    $('#topBarActions').html(`
      <input id="shopSearch" placeholder="🔍 Search shops..." value="${marketplaceFilter.search}" style="max-width:280px;">
      <select id="shopCategory" style="max-width:180px;">
        <option value="">All Categories</option>
        ${categories.map(c => `<option value="${c}" ${marketplaceFilter.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    `);

    $('#appView').html(`
      <div class="row" style="justify-content:space-between;margin-bottom:20px;">
        <p class="muted">${shops.length} shops available in the marketplace</p>
      </div>
      <div id="shopGrid"></div>
    `);

    renderShopGrid(shops);
    $('#shopSearch').on('input', function() { marketplaceFilter.search = $(this).val(); renderShopGrid(shops); });
    $('#shopCategory').on('change', function() { marketplaceFilter.category = $(this).val(); renderShopGrid(shops); });
  }

  function renderShopGrid(shops) {
    let filtered = shops.filter(s => {
      const matchSearch = !marketplaceFilter.search || s.name.toLowerCase().includes(marketplaceFilter.search.toLowerCase()) || s.location.toLowerCase().includes(marketplaceFilter.search.toLowerCase());
      const matchCat = !marketplaceFilter.category || s.category === marketplaceFilter.category;
      return matchSearch && matchCat;
    });
    if (!filtered.length) {
      $('#shopGrid').html(`<div class="empty-state"><div class="icon">🏪</div><h3>No shops found</h3><p class="muted">Try a different search or category</p></div>`);
      return;
    }
    $('#shopGrid').html(`<div class="grid-3">${filtered.map(s => {
      const prodCount = getProductsByShop(s.id).length;
      return `<div class="shop-card">
        <div style="display:flex;gap:14px;align-items:center;">
          <div class="shop-logo">${s.logo || '🏪'}</div>
          <div style="flex:1;min-width:0;">
            <h3 style="margin:0;font-size:1.1rem;">${s.name}</h3>
            <span class="badge ${s.active?'open':'closed'}">${s.active?'Open':'Closed'}</span>
          </div>
        </div>
        <p class="muted">${s.description}</p>
        <div style="font-size:0.85rem;display:flex;gap:12px;flex-wrap:wrap;">
          <span>📍 ${s.location}</span>
          <span>📞 ${s.contact}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
          <span class="muted">📦 ${prodCount} products</span>
          <button class="viewShopBtn" data-id="${s.id}" style="padding:8px 18px;font-size:0.85rem;">View Shop →</button>
        </div>
      </div>`;
    }).join('')}</div>`);
    $('.viewShopBtn').off('click').on('click', function() { openShopfront($(this).data('id')); });
  }

  function openShopfront(shopId) {
    const shop = getShop(shopId);
    const products = getProductsByShop(shopId);

    $('#topBarActions').html(`<button id="backToMarket" class="secondary">← Back</button>`);
    $('#backToMarket').on('click', () => renderView('marketplace'));

    $('#appView').html(`
      <div class="card" style="margin-bottom:24px;">
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
          <div class="shop-logo" style="width:80px;height:80px;font-size:2.4rem;">${shop.logo||'🏪'}</div>
          <div style="flex:1;min-width:200px;">
            <h2 style="margin:0;">${shop.name}</h2>
            <p class="muted">${shop.description}</p>
            <div style="font-size:0.85rem;">📍 ${shop.location} · 📞 ${shop.contact}</div>
          </div>
          <div><span class="badge ${shop.active?'open':'closed'}">${shop.active?'Open':'Closed'}</span></div>
        </div>
      </div>
      <div class="row" style="margin-bottom:20px;">
        <input id="productSearch" placeholder="🔍 Search products by name, SKU, category or brand..." style="max-width:480px;">
      </div>
      <div id="productList"></div>
    `);
    renderProductGrid(shopId, products);
    $('#productSearch').on('input', function() { renderProductGrid(shopId, products, $(this).val()); });
  }

  function renderProductGrid(shopId, products, search) {
    let filtered = products;
    if (search) {
      const q = search.toLowerCase();
      filtered = products.filter(p =>
        p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q)
      );
    }
    if (!filtered.length) {
      $('#productList').html(`<div class="empty-state"><div class="icon">🔍</div><h3>No products found</h3><p class="muted">Try a different search term</p></div>`);
      return;
    }
    $('#productList').html(`<div class="grid-3">${filtered.map(p => {
      const stock = getStock(p.id);
      return `<div class="card" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;gap:14px;align-items:center;">
          <div class="product-thumb">${p.image||'📦'}</div>
          <div style="flex:1;min-width:0;">
            <h4 style="margin:0;font-size:1rem;">${p.name}</h4>
            <p class="muted" style="font-size:0.78rem;">${p.brand} · SKU: ${p.sku}</p>
          </div>
        </div>
        <p class="muted" style="font-size:0.82rem;">${p.description}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="price">${formatTZS(p.price)}</span>
          <span class="badge ${stock>0?'open':'closed'}" style="font-size:0.72rem;">${stock>0?stock+' in stock':'Out of stock'}</span>
        </div>
        <button class="addToCartBtn" data-id="${p.id}" ${stock<1?'disabled':''} style="width:100%;padding:10px;">${stock>0?'Add to Cart':'Out of Stock'}</button>
      </div>`;
    }).join('')}</div>`);
    $('.addToCartBtn').off('click').on('click', function() {
      const pid = $(this).data('id');
      const stock = getStock(pid);
      if (stock < 1) return toast('Out of stock', true);
      const cart = get(LS.CART, {});
      if (!cart[pid]) {
        const prod = getProduct(pid);
        cart[pid] = { qty: 1, shopId: prod.shopId, price: prod.price, name: prod.name, image: prod.image };
      } else {
        if (cart[pid].qty + 1 > stock) return toast('Not enough stock available', true);
        cart[pid].qty++;
      }
      set(LS.CART, cart);
      toast('Added to cart ✓');
      renderSidebar();
    });
  }

  function viewCart() {
    const cart = get(LS.CART, {});
    const items = Object.entries(cart).map(([pid, item]) => ({ ...item, productId: pid }));
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);

    if (!items.length) {
      $('#appView').html(`<div class="empty-state"><div class="icon">🛒</div><h2>Your cart is empty</h2><p class="muted" style="margin-bottom:20px;">Browse the marketplace to add items</p><button data-nav="marketplace">Go to Marketplace</button></div>`);
      $('[data-nav="marketplace"]').on('click', () => renderView('marketplace'));
      return;
    }
    $('#appView').html(`
      <div style="margin-bottom:24px;">${items.map(i => `
        <div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:10px;padding:16px 22px;">
          <div class="product-thumb" style="width:48px;height:48px;font-size:1.4rem;">${i.image||'📦'}</div>
          <div style="flex:1;min-width:0;">
            <b>${i.name}</b>
            <p class="muted" style="font-size:0.82rem;">${formatTZS(i.price)} each</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="qtyBtn secondary" data-pid="${i.productId}" data-delta="-1" style="padding:6px 12px;min-width:36px;">−</button>
            <span style="font-weight:700;min-width:24px;text-align:center;">${i.qty}</span>
            <button class="qtyBtn secondary" data-pid="${i.productId}" data-delta="1" style="padding:6px 12px;min-width:36px;">+</button>
          </div>
          <div style="text-align:right;min-width:110px;">
            <b class="price">${formatTZS(i.price*i.qty)}</b>
          </div>
          <button class="removeCartBtn danger" data-pid="${i.productId}" style="padding:6px 12px;font-size:0.8rem;">✕</button>
        </div>
      `).join('')}</div>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div><span class="muted">Total</span><h2 style="margin:0;">${formatTZS(total)}</h2></div>
        <button id="checkoutBtn" style="padding:14px 36px;">Place Order (Pay on Delivery) →</button>
      </div>
    `);
    $('.qtyBtn').off('click').on('click', function() {
      const pid = $(this).data('pid');
      const delta = parseInt($(this).data('delta'));
      const cart = get(LS.CART, {});
      if (!cart[pid]) return;
      const newQty = cart[pid].qty + delta;
      if (newQty < 1) { delete cart[pid]; }
      else {
        if (delta > 0 && newQty > getStock(pid)) return toast('Not enough stock', true);
        cart[pid].qty = newQty;
      }
      set(LS.CART, cart);
      viewCart();
      renderSidebar();
    });
    $('.removeCartBtn').off('click').on('click', function() {
      const cart = get(LS.CART, {});
      delete cart[$(this).data('pid')];
      set(LS.CART, cart);
      viewCart();
      renderSidebar();
    });
    $('#checkoutBtn').off('click').on('click', function() {
      const cart = get(LS.CART, {});
      const items = Object.entries(cart).map(([pid, item]) => ({ productId: pid, ...item }));
      if (!items.length) return;
      for (const i of items) {
        if (i.qty > getStock(i.productId)) return toast('Insufficient stock for ' + i.name, true);
      }
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      const orderId = uid('co_');
      const orders = get(LS.CUST_ORDERS, []);
      orders.push({ id: orderId, customerId: currentUser().id, shopId: items[0].shopId, date: new Date().toISOString(), status: 'pending', total });
      set(LS.CUST_ORDERS, orders);
      // Do NOT reduce stock yet — stock is reduced when shopkeeper approves
      items.forEach(i => {
        const orderItems = get(LS.ORDER_ITEMS, []);
        orderItems.push({ id: uid('oi_'), orderId, productId: i.productId, qty: i.qty, price: i.price });
        set(LS.ORDER_ITEMS, orderItems);
      });
      set(LS.CART, {});
      addAudit('Customer order placed (pending shopkeeper approval)', currentUser().id);
      toast('Order placed! Awaiting shopkeeper approval.');
      renderView('orders');
    });
  }

    $('#topBarActions').html(`<button id="backToSupplierMarket" class="secondary">← Back</button>`);

    $('#appView').html(`

      <div id="supplierProdList"></div>
    `);

            <td>
              <button class="stockInBtn secondary" data-pid="${p.id}" style="padding:6px 12px;font-size:0.78rem;">+ Stock In</button>

    $('.stockInBtn').off('click').on('click', function() {

      const qty = parseInt(prompt('Quantity to add:'));
      if (qty > 0) { adjustStock(pid, qty); addAudit('Stock in ' + qty + ' units', user.id); toast('Stock updated'); viewInventory(); }

    $('.stockOutBtn').off('click').on('click', function() {
      const pid = $(this).data('pid');
      const qty = parseInt(prompt('Quantity to remove:'));
      if (qty > 0 && qty <= getStock(pid)) { adjustStock(pid, -qty); addAudit('Stock out ' + qty + ' units', user.id); toast('Stock updated'); viewInventory(); }
      else if (qty > getStock(pid)) toast('Insufficient stock', true);

  function viewShopkeeperCustomerOrders() {
    const user = currentUser();
    const shops = getShopsByOwner(user.id);
    const shopIds = shops.map(s => s.id);
    const orders = get(LS.CUST_ORDERS, []).filter(o => shopIds.includes(o.shopId)).sort((a,b)=>new Date(b.date)-new Date(a.date));

    $('#appView').html(`
      ${orders.length ? orders.map(o => {
        const shop = getShop(o.shopId);
        const customer = getUser(o.customerId);
        const orderItems = get(LS.ORDER_ITEMS, []).filter(oi => oi.orderId === o.id);
        return `<div class="card" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <b>Order ${o.id.slice(-6)}</b>
              <p class="muted" style="font-size:0.82rem;">Customer: ${customer?customer.name:'—'} · Shop: ${shop?shop.name:'—'}</p>
              <p class="muted" style="font-size:0.82rem;">${new Date(o.date).toLocaleString()}</p>
            </div>
            <div style="text-align:right;">
              <span class="badge ${o.status==='delivered'?'delivered':o.status==='approved'?'accepted':o.status==='rejected'?'rejected':'pending'}">${o.status}</span>
              <p class="price">${formatTZS(o.total)}</p>
            </div>
          </div>
          <div class="separator" style="margin:10px 0;"></div>
          <div style="font-size:0.85rem;">${orderItems.map(i => {
            const p = getProduct(i.productId);
            return `<div>${p?p.name:'Item'} × ${i.qty} — ${formatTZS(i.price*i.qty)}</div>`;
          }).join('')}</div>
          ${o.status==='pending' ? `<div class="row" style="margin-top:12px;">
            <button class="approveCustOrder" data-oid="${o.id}" style="background:var(--green-mid);">✓ Approve & Fulfill</button>
            <button class="rejectCustOrder danger" data-oid="${o.id}">✗ Reject</button>
          </div>` : ''}
          ${o.status==='approved' ? `<button class="completeCustOrder" data-oid="${o.id}" style="margin-top:12px;width:100%;">Mark as Delivered</button>` : ''}
        </div>`;
      }).join('') : '<div class="empty-state"><div class="icon">📦</div><h3>No customer orders yet</h3></div>'}
    `);

    $('.approveCustOrder').off('click').on('click', function() {
      const oid = $(this).data('oid');
      const orders = get(LS.CUST_ORDERS, []);
      const order = orders.find(o => o.id === oid);
      if (!order) return;
      // Verify stock is still available before approving
      const items = get(LS.ORDER_ITEMS, []).filter(oi => oi.orderId === oid);
      for (const item of items) {
        if (item.qty > getStock(item.productId)) {
          return toast('Not enough stock for ' + (getProduct(item.productId)?.name || 'item') + '. Cannot approve.', true);
        }
      }
      // Deduct stock and create sale records
      items.forEach(item => {
        adjustStock(item.productId, -item.qty);
        const sales = get(LS.SALES, []);
        sales.push({
          id: uid('s_'), shopId: order.shopId, productId: item.productId, qty: item.qty,
          unitPrice: item.price, total: item.price * item.qty, payment: 'Online',
          date: new Date().toISOString(), miniId: null, status: 'completed'
        });
        set(LS.SALES, sales);
      });
      order.status = 'approved';
      set(LS.CUST_ORDERS, orders);
      addAudit('Shopkeeper approved customer order ' + oid, user.id);
      toast('Order approved! Stock deducted and sale recorded.');
      viewShopkeeperCustomerOrders();
      renderSidebar();
    });

    $('.rejectCustOrder').off('click').on('click', function() {
      const oid = $(this).data('oid');
      const orders = get(LS.CUST_ORDERS, []);
      const order = orders.find(o => o.id === oid);
      if (!order) return;
      order.status = 'rejected';
      set(LS.CUST_ORDERS, orders);
      addAudit('Shopkeeper rejected customer order ' + oid, user.id);
      toast('Order rejected.');
      viewShopkeeperCustomerOrders();
      renderSidebar();
    });

    $('.completeCustOrder').off('click').on('click', function() {
      const oid = $(this).data('oid');
      const orders = get(LS.CUST_ORDERS, []);
      const order = orders.find(o => o.id === oid);
      if (!order) return;
      order.status = 'delivered';
      set(LS.CUST_ORDERS, orders);
      addAudit('Customer order marked delivered: ' + oid, user.id);
      toast('Order marked as delivered.');
      viewShopkeeperCustomerOrders();
    });
  }

        ${shops.map(s => {
          const shopSales = sales.filter(sa => sa.shopId === s.id);
          return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
            <span><b>${s.name}</b></span>
            <span>${shopSales.length} sales · <b class="price">${formatTZS(shopSales.reduce((x,y)=>x+y.total,0))}</b></span>
          </div>`;
        }).join('')}
      </div>
      <div class="card" style="margin-top:16px;">
        <h3 style="margin-bottom:6px;">Inventory Value</h3>
        <p class="muted" style="margin-bottom:10px;">Total retail value of current stock</p>
        <h2>${formatTZS(products.reduce((s,p)=>s + p.price * getStock(p.id), 0))}</h2>
      </div>
    `);
  }

  // ============================================================
  // MINI SHOPKEEPER
  // ============================================================
  function getMiniShops(miniId) {
    return get(LS.MINI_ASSIGN, []).filter(a => a.miniId === miniId).map(a => getShop(a.shopId)).filter(Boolean);
  }

  function viewMiniDashboard() {
    const user = currentUser();
    const shops = getMiniShops(user.id);
    const today = new Date().toISOString().slice(0,10);
    const mySales = get(LS.SALES, []).filter(s => s.miniId === user.id);
    const todaySales = mySales.filter(s => s.date.slice(0,10) === today);

    $('#appView').html(`
      <div class="grid-4" style="margin-bottom:24px;">
        <div class="stat-card"><div class="stat-label">Assigned Shops</div><div class="stat-value">${shops.length}</div></div>
        <div class="stat-card"><div class="stat-label">Today's Sales</div><div class="stat-value">${todaySales.length}</div></div>
        <div class="stat-card"><div class="stat-label">Today's Revenue</div><div class="stat-value" style="font-size:1.3rem;">${formatTZS(todaySales.reduce((s,x)=>s+x.total,0))}</div></div>
        <div class="stat-card"><div class="stat-label">All-time Sales</div><div class="stat-value">${mySales.length}</div></div>
      </div>
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-bottom:12px;">Assigned Shops</h3>
        ${shops.map(s => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
          <span><b>${s.name}</b> · 📍 ${s.location}</span>
          <span class="badge open">Active</span>
        </div>`).join('') || '<p class="muted">No shops assigned</p>'}
      </div>
      <div class="row">
        <button data-nav="miniSale">Record Sale →</button>
        <button data-nav="miniHistory" class="secondary">My Sales →</button>
      </div>
    `);
    $('[data-nav]').on('click', function() { renderView($(this).data('nav')); });
  }

  function viewMiniSale() {
    const user = currentUser();
    const shops = getMiniShops(user.id);
    if (!shops.length) {
      $('#appView').html(`<div class="empty-state"><div class="icon">🏪</div><h3>No shop assigned</h3><p class="muted">Contact your manager</p></div>`);
      return;
    }
    let selectedShopId = shops[0].id;

    $('#topBarActions').html(`
      <select id="saleShopSelect" style="max-width:320px;">
        ${shops.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
      </select>
    `);

    $('#appView').html(`
      <div id="saleProductList"></div>
      <div class="card" style="margin-top:20px;">
        <h3 style="margin-bottom:12px;">Current Sale</h3>
        <div id="saleItems"></div>
        <div class="separator"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">Total: <span id="saleTotal" class="price">TZS 0</span></h3>
          <button id="completeSaleBtn" style="padding:12px 28px;">Complete Sale</button>
        </div>
      </div>
    `);

    let saleItems = {};

    function renderProductList(shopId) {
      const products = getProductsByShop(shopId);
      $('#saleProductList').html(`<div class="grid-3">${products.map(p => {
        const stock = getStock(p.id);
        return `<div class="card" style="display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;gap:12px;align-items:center;">
            <div class="product-thumb" style="width:48px;height:48px;font-size:1.4rem;">${p.image||'📦'}</div>
            <div style="flex:1;"><h4 style="margin:0;font-size:0.95rem;">${p.name}</h4><p class="muted" style="font-size:0.78rem;">${formatTZS(p.price)}</p></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="badge ${stock>0?'open':'closed'}">${stock} in stock</span>
            <button class="addSaleItemBtn" data-pid="${p.id}" data-name="${p.name}" data-price="${p.price}" data-stock="${stock}" ${stock<1?'disabled':''} style="padding:8px 16px;font-size:0.82rem;">Add</button>
          </div>
        </div>`;
      }).join('')}</div>`);
    }

    function renderSaleItems() {
      const entries = Object.entries(saleItems);
      if (!entries.length) {
        $('#saleItems').html('<p class="muted">No items added yet</p>');
        $('#saleTotal').text('TZS 0');
        return;
      }
      $('#saleItems').html(entries.map(([pid, item]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
          <span>${item.name} × ${item.qty}</span>
          <span>${formatTZS(item.price * item.qty)}</span>
        </div>
      `).join(''));
      const total = entries.reduce((s, [_, i]) => s + i.price * i.qty, 0);
      $('#saleTotal').text(formatTZS(total));
    }

    renderProductList(selectedShopId);
    renderSaleItems();

    $('#saleShopSelect').on('change', function() { selectedShopId = $(this).val(); saleItems = {}; renderProductList(selectedShopId); renderSaleItems(); });

    $(document).off('click', '.addSaleItemBtn').on('click', '.addSaleItemBtn', function() {
      const pid = $(this).data('pid');
      const stock = $(this).data('stock');
      const existing = saleItems[pid] ? saleItems[pid].qty : 0;
      if (existing + 1 > stock) return toast('Not enough stock', true);
      if (!saleItems[pid]) saleItems[pid] = { qty: 1, price: $(this).data('price'), name: $(this).data('name') };
      else saleItems[pid].qty++;
      renderSaleItems();
    });

    $('#completeSaleBtn').off('click').on('click', function() {
      const entries = Object.entries(saleItems);
      if (!entries.length) return toast('Add items first', true);
      const sales = get(LS.SALES, []);
      entries.forEach(([pid, item]) => {
        const total = item.price * item.qty;
        sales.push({
          id: uid('s_'), shopId: selectedShopId, productId: pid, qty: item.qty,
          unitPrice: item.price, total, payment: 'Cash', date: new Date().toISOString(),
          miniId: user.id, status: 'completed'
        });
        adjustStock(pid, -item.qty);
      });
      set(LS.SALES, sales);
      addAudit('Mini sale recorded', user.id);
      toast('Sale completed! Receipt ready.');
      saleItems = {};
      renderSaleItems();
      renderProductList(selectedShopId);
    });
  }

  function viewMiniSalesHistory() {
    const user = currentUser();
    const sales = get(LS.SALES, []).filter(s => s.miniId === user.id).sort((a,b)=>new Date(b.date)-new Date(a.date));

    $('#appView').html(`
      ${sales.length ? `<div class="card" style="overflow-x:auto;"><table>
        <thead><tr><th>Date</th><th>Shop</th><th>Product</th><th>Qty</th><th>Total</th><th>Payment</th></tr></thead>
        <tbody>${sales.map(s => {
          const shop = getShop(s.shopId);
          const prod = getProduct(s.productId);
          return `<tr>
            <td class="muted">${new Date(s.date).toLocaleString()}</td>
            <td>${shop?shop.name:'—'}</td>
            <td>${prod?prod.name:'—'}</td>
            <td>${s.qty}</td>
            <td class="price">${formatTZS(s.total)}</td>
            <td>${s.payment}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : '<div class="empty-state"><div class="icon">📋</div><h3>No sales recorded yet</h3></div>'}
    `);
  }

  // ============================================================
  // SUPPLIER VIEWS
  // ============================================================
  function viewSupplierDashboard() {
    const user = currentUser();
    const shops = getShopsByOwner(user.id, 'supplier');
    const shopIds = shops.map(s => s.id);
    const products = get(LS.PRODUCTS, []).filter(p => shopIds.includes(p.shopId));
    const pos = get(LS.POs, []).filter(o => shopIds.includes(o.supplierShopId));
    const pending = pos.filter(o => o.status === 'pending');
    const delivered = pos.filter(o => o.status === 'delivered');

    $('#topBarActions').html(`
      <button data-nav="supplierShops">Manage Shops →</button>
      <button data-nav="supplierOrders" class="secondary">Purchase Orders →</button>
    `);
    $('[data-nav]').on('click', function() { renderView($(this).data('nav')); });

    $('#appView').html(`
      <div class="grid-4" style="margin-bottom:24px;">
        <div class="stat-card"><div class="stat-label">My Shops</div><div class="stat-value">${shops.length}</div></div>
        <div class="stat-card"><div class="stat-label">Products</div><div class="stat-value">${products.length}</div></div>
        <div class="stat-card"><div class="stat-label">Pending POs</div><div class="stat-value" style="color:${pending.length?'var(--warn)':'inherit'}">${pending.length}</div></div>
        <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value">${delivered.length}</div></div>
      </div>
      ${pending.length ? `<div class="card" style="border-left:4px solid var(--warn);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div><b>🛎️ You have ${pending.length} pending purchase order(s)</b><p class="muted">Review and accept/reject them</p></div>
        <button data-nav="supplierOrders">Review Orders →</button>
      </div>` : ''}
      <div class="grid-3">
        <div class="card">
          <h3 style="margin-bottom:12px;">🏬 My Shops</h3>
          ${shops.map(s => {
            const sp = getProductsByShop(s.id);
            return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
              <span><b>${s.name}</b><br><span class="muted" style="font-size:0.78rem;">${sp.length} products</span></span>
              <span class="badge ${s.active?'open':'closed'}">${s.active?'Active':'Inactive'}</span>
            </div>`;
          }).join('') || '<p class="muted">No shops yet</p>'}
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">📑 Recent POs</h3>
          ${pos.slice(-5).reverse().map(o => {
            const buyer = getUser(o.shopkeeperId);
            return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
              <span>${buyer?buyer.name:'Buyer'}</span><span class="price" style="font-size:0.95rem;">${formatTZS(o.total)}</span>
            </div>`;
          }).join('') || '<p class="muted">No orders yet</p>'}
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">📦 Top Products</h3>
          ${products.slice(0,5).map(p => {
            const stock = getStock(p.id);
            return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
              <span>${p.name}</span><span class="badge">${stock} units</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    `);
  }

  function viewSupplierShops() {
    const user = currentUser();
    const shops = getShopsByOwner(user.id, 'supplier');

    $('#topBarActions').html(`<button id="addSupplierShopBtn">+ Add Shop</button>`);

    $('#appView').html(`
      <div class="grid-3">${shops.map(s => `
        <div class="shop-card">
          <div style="display:flex;gap:14px;align-items:center;">
            <div class="shop-logo">${s.logo||'📦'}</div>
            <div><h3 style="margin:0;font-size:1.05rem;">${s.name}</h3><span class="badge ${s.active?'open':'closed'}">${s.active?'Active':'Inactive'}</span></div>
          </div>
          <p class="muted">${s.description}</p>
          <p class="muted" style="font-size:0.82rem;">📍 ${s.location} · 📞 ${s.contact}</p>
          <p class="muted" style="font-size:0.82rem;">📦 ${getProductsByShop(s.id).length} products</p>
        </div>
      `).join('') || '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🏬</div><h3>No supplier shops yet</h3></div>'}</div>
    `);
    $('#addSupplierShopBtn').off('click').on('click', function() {
      $('#appView').prepend(`
        <div class="modal-bg" id="addSupShopModal">
          <div class="modal-box">
            <h2>Add Supplier Shop</h2>
            <input id="ssName" placeholder="Shop name" style="margin-bottom:12px;">
            <input id="ssDesc" placeholder="Description" style="margin-bottom:12px;">
            <input id="ssLocation" placeholder="Location" style="margin-bottom:12px;">
            <input id="ssContact" placeholder="Contact phone" style="margin-bottom:12px;">
            <input id="ssCategory" placeholder="Category" style="margin-bottom:20px;">
            <div class="row" style="justify-content:flex-end;">
              <button class="secondary" id="cancelAddSupShop">Cancel</button>
              <button id="saveAddSupShop">Create</button>
            </div>
          </div>
        </div>
      `);
      $('#cancelAddSupShop').on('click', () => $('#addSupShopModal').remove());
      $('#saveAddSupShop').on('click', function() {
        const name = $('#ssName').val().trim();
        if (!name) return toast('Shop name required', true);
        const shops = get(LS.SHOPS, []);
        shops.push({
          id: uid('shop_'), ownerId: user.id, type: 'supplier', name,
          description: $('#ssDesc').val().trim() || 'New supplier shop',
          location: $('#ssLocation').val().trim() || '—',
          contact: $('#ssContact').val().trim() || '—',
          logo: '📦', category: $('#ssCategory').val().trim() || 'General',
          active: true, approved: true
        });
        set(LS.SHOPS, shops);
        toast('Supplier shop created!');
        $('#addSupShopModal').remove();
        viewSupplierShops();
      });
    });
  }

  function viewSupplierProducts() {
    const user = currentUser();
    const shops = getShopsByOwner(user.id, 'supplier');
    const shopIds = shops.map(s => s.id);
    const products = get(LS.PRODUCTS, []).filter(p => shopIds.includes(p.shopId));

    $('#topBarActions').html(`
      <input id="supplierProdFilter" placeholder="🔍 Search products..." style="max-width:300px;">
      <button id="addSupplierProductBtn">+ Add Product</button>
    `);
    $('#appView').html(`<div id="supplierProductsTable"></div>`);

    function render(q) {
      let list = products;
      if (q) { const s = q.toLowerCase(); list = products.filter(p => p.name.toLowerCase().includes(s) || p.sku.toLowerCase().includes(s)); }
      if (!list.length) { $('#supplierProductsTable').html('<div class="empty-state"><div class="icon">📦</div><h3>No products</h3></div>'); return; }
      $('#supplierProductsTable').html(`<div class="card" style="overflow-x:auto;"><table>
        <thead><tr><th>Product</th><th>Shop</th><th>Wholesale Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody>${list.map(p => {
          const shop = getShop(p.shopId);
          const stock = getStock(p.id);
          return `<tr>
            <td><b>${p.name}</b><br><span class="muted" style="font-size:0.78rem;">${p.sku}</span></td>
            <td class="muted">${shop?shop.name:'—'}</td>
            <td class="price">${formatTZS(p.price)}</td>
            <td><span class="badge ${stock>0?'open':'closed'}">${stock}</span></td>
            <td><button class="editSuppProdBtn secondary" data-id="${p.id}" style="padding:6px 12px;font-size:0.78rem;">Edit</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`);
      $('.editSuppProdBtn').off('click').on('click', () => toast('Product edit would open here'));
    }
    render('');
    $('#supplierProdFilter').on('input', function() { render($(this).val()); });
    $('#addSupplierProductBtn').off('click').on('click', function() {
      const shopOptions = shops.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      $('#appView').prepend(`
        <div class="modal-bg" id="addSupProdModal">
          <div class="modal-box">
            <h2>Add Supplier Product</h2>
            <input id="spName" placeholder="Product name" style="margin-bottom:12px;">
            <input id="spSku" placeholder="SKU" style="margin-bottom:12px;">
            <input id="spCategory" placeholder="Category" style="margin-bottom:12px;">
            <input id="spPrice" type="number" placeholder="Wholesale price (TZS)" style="margin-bottom:12px;">
            <input id="spStock" type="number" placeholder="Stock quantity" style="margin-bottom:12px;">
            <input id="spDesc" placeholder="Description" style="margin-bottom:12px;">
            <select id="spShop" style="margin-bottom:20px;">${shopOptions}</select>
            <div class="row" style="justify-content:flex-end;">
              <button class="secondary" id="cancelAddSupProd">Cancel</button>
              <button id="saveAddSupProd">Create</button>
            </div>
          </div>
        </div>
      `);
      $('#cancelAddSupProd').on('click', () => $('#addSupProdModal').remove());
      $('#saveAddSupProd').on('click', function() {
        const name = $('#spName').val().trim();
        if (!name) return toast('Name required', true);
        const prods = get(LS.PRODUCTS, []);
        const newId = uid('p_');
        prods.push({
          id: newId, shopId: $('#spShop').val(), name,
          sku: $('#spSku').val().trim() || 'SKU-' + newId.slice(-4),
          category: $('#spCategory').val().trim() || 'General',
          brand: 'Generic',
          price: parseFloat($('#spPrice').val()) || 0,
          description: $('#spDesc').val().trim() || '',
          image: '📦'
        });
        set(LS.PRODUCTS, prods);
        const inv = get(LS.INVENTORY, []);
        inv.push({ productId: newId, shopId: $('#spShop').val(), quantity: parseInt($('#spStock').val()) || 0 });
        set(LS.INVENTORY, inv);
        toast('Product created!');
        $('#addSupProdModal').remove();
        viewSupplierProducts();
      });
    });
  }

  function viewSupplierOrders() {
    const user = currentUser();
    const shopIds = getShopsByOwner(user.id, 'supplier').map(s => s.id);
    const pos = get(LS.POs, []).filter(o => shopIds.includes(o.supplierShopId)).sort((a,b)=>new Date(b.orderDate)-new Date(a.orderDate));

    $('#appView').html(`
      ${pos.length ? pos.map(o => {
        const buyer = getUser(o.shopkeeperId);
        const items = get(LS.PO_ITEMS, []).filter(i => i.poId === o.id);
        return `<div class="card" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <b>PO ${o.id.slice(-6)}</b>
              <p class="muted" style="font-size:0.82rem;">From: ${buyer?buyer.name:'—'}</p>
              <p class="muted" style="font-size:0.82rem;">${new Date(o.orderDate).toLocaleString()}</p>
            </div>
            <div style="text-align:right;">
              <span class="badge ${o.status==='pending'?'pending':o.status==='delivered'?'delivered':o.status==='rejected'?'rejected':'accepted'}">${o.status}</span>
              <p class="price">${formatTZS(o.total)}</p>
            </div>
          </div>
          <div class="separator" style="margin:10px 0;"></div>
          <div style="font-size:0.85rem;">${items.map(i => {
            const p = getProduct(i.productId);
            return `<div>${p?p.name:'Item'} × ${i.qty}</div>`;
          }).join('')}</div>
          ${o.status==='pending' ? `<div class="row" style="margin-top:12px;">
            <button class="acceptPO" data-poid="${o.id}" style="background:var(--green-mid);">✓ Accept Order</button>
            <button class="rejectPO danger" data-poid="${o.id}">✗ Reject</button>
          </div>` : ''}
          ${o.status==='accepted' ? `<button class="dispatchPO" data-poid="${o.id}" style="margin-top:12px;width:100%;">Record Dispatch & Delivery</button>` : ''}
        </div>`;
      }).join('') : '<div class="empty-state"><div class="icon">📑</div><h3>No purchase orders received</h3></div>'}
    `);
    $('.acceptPO').off('click').on('click', function() {
      const poId = $(this).data('poid');
      const pos = get(LS.POs, []);
      const po = pos.find(p => p.id === poId);
      if (po) { po.status = 'accepted'; set(LS.POs, pos); addAudit('Supplier accepted PO ' + poId, currentUser().id); toast('PO accepted'); viewSupplierOrders(); renderSidebar(); }
    });
    $('.rejectPO').off('click').on('click', function() {
      const poId = $(this).data('poid');
      const pos = get(LS.POs, []);
      const po = pos.find(p => p.id === poId);
      if (po) { po.status = 'rejected'; set(LS.POs, pos); addAudit('Supplier rejected PO ' + poId, currentUser().id); toast('PO rejected'); viewSupplierOrders(); renderSidebar(); }
    });
    $('.dispatchPO').off('click').on('click', function() {
      const poId = $(this).data('poid');
      const pos = get(LS.POs, []);
      const po = pos.find(p => p.id === poId);
      if (po) { po.status = 'delivered'; set(LS.POs, pos); addAudit('Supplier dispatched PO ' + poId, currentUser().id); toast('Delivery recorded — awaiting shopkeeper confirmation'); viewSupplierOrders(); }
    });
  }

  // ============================================================
  // MOBILE SIDEBAR
  // ============================================================
  function openSidebar() { $('#sidebar').addClass('open'); $('#sidebarOverlay').addClass('show'); }
  function closeSidebar() { $('#sidebar').removeClass('open'); $('#sidebarOverlay').removeClass('show'); }
  $('#sidebarToggle').on('click', function() { if ($('#sidebar').hasClass('open')) closeSidebar(); else openSidebar(); });
  $('#sidebarOverlay').on('click', closeSidebar);

  // ============================================================
  // GLOBAL NAV EVENT
  // ============================================================
  $(document).on('click', '[data-nav]', function(e) {
    e.preventDefault();
    const nav = $(this).data('nav');
    if (nav === 'logout') { logout(); return; }
    renderView(nav);
  });

  // ============================================================
  // BOOT
  // ============================================================
  seed();
  const user = currentUser();
  if (user) {
    if (user.role === 'customer') renderView('marketplace');
    else if (user.role === 'main_shopkeeper') renderView('dashboard');
    else if (user.role === 'mini_shopkeeper') renderView('miniDashboard');
    else if (user.role === 'supplier') renderView('supplierDashboard');
  } else {
    renderView('login');
  }

  window.MSH = { get, set, LS, currentUser, toast, renderView };
});
</script>
</body>
</html>
